services:
  user-db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    ports:
      - "5433:5432"
    volumes:
      - user_data:/var/lib/postgresql/data

  product-db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productdb
    ports:
      - "5434:5432"
    volumes:
      - product_data:/var/lib/postgresql/data

  order-db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderdb
    ports:
      - "5435:5432"
    volumes:
      - order_data:/var/lib/postgresql/data
  saga-db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sagadb
    ports:
      - "5436:5432"
    volumes:
      - saga_data:/var/lib/postgresql/data
  payment-db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paymentdb
    ports:
      - "5437:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes


  gateway:
    build:
      context: ./api-gateway
      dockerfile: DockerFile
    container_name: api-gateway
    ports:
      - "3000:3000"

    environment:
      PORT: "3000"

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      JWT_SECRET: ALSDAJKLDSAKDKLSKSLDLKSAD55445ASMDLKSD
      JWT_REFRESH: SAKJDKJSDDSJ066556556ASDLSD:LDSALSDAL

    depends_on:
      - redis
  product:
    build:
      context: ./product
      dockerfile: DockerFile
    container_name: product-service
    ports:
      - "3002:3002"
      - "50051:50051"
    environment:
      PORT: ":3002"
      GRPC_PORT: ":50051"
      POSTGRES_HOST: product-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productdb
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      - product-db
      - redis
      - rabbitmq
  order:
    build:
      context: ./order
      dockerfile: DockerFile
    container_name: order-service
    ports:
      - "3003:3003"
    environment:
      PORT: ":3003"
      POSTGRES_HOST: order-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderdb
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      PRODUCT_SERVICE_URL: http://product:3002
      USER_SERVICE_URL: http://user:3001
    depends_on:
      - order-db
      - redis
      - rabbitmq
  user:
    build:
      context: ./user
      dockerfile: DockerFile
    container_name: user-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@user-db:5432/userdb?schema=public

      JWT_SECRET: ALSDAJKLDSAKDKLSKSLDLKSAD55445ASMDLKSD
      JWT_REFRESH: SAKJDKJSDDSJ066556556ASDLSD:LDSALSDAL
      JWT_SECRET_EXPIRE: 1d
      JWT_REFRESH_EXPIRE: 7d

      ORDER_URL: http://order:3003
      PRODUCT_URL: http://product:3002

    depends_on:
      - user-db
      - product
      - order
      
volumes:
  user_data:
  product_data:
  order_data:
  saga_data:
  payment_data:
  redis_data: